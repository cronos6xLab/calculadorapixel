<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>¿Por qué Claude susurra?</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#05030c;overflow:hidden;
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  #stage{
    position:absolute;top:50%;left:50%;
    width:1080px;height:1920px;
    transform:translate(-50%,-50%) scale(1);
    transform-origin:center center;
    overflow:hidden;
    background:#0a0620;
  }
  #c{display:block;width:1080px;height:1920px;}

  /* ---------- Bocadillos ---------- */
  .bubble{
    position:absolute;
    padding:34px 46px;
    border-radius:52px;
    font-size:62px;
    font-weight:800;
    line-height:1.12;
    letter-spacing:-1px;
    opacity:0;
    transform:scale(.5) translateY(46px);
    transition:opacity .26s ease, transform .5s cubic-bezier(.34,1.56,.64,1);
    will-change:transform,opacity;
    pointer-events:none;
  }
  .bubble.show{opacity:1;transform:scale(1) translateY(0);}

  .b1,.b3{
    --fill:#fff4e2;--line:#ff4d5e;
    left:62px;max-width:640px;
    background:var(--fill);color:#20113a;
    border:9px solid var(--line);
    box-shadow:0 28px 70px rgba(0,0,0,.6),0 0 70px rgba(255,77,94,.28);
  }
  .b1{top:236px;}
  .b3{top:290px;max-width:600px;}

  .b1::before,.b3::before{
    content:"";position:absolute;left:88px;bottom:-72px;
    width:42px;height:42px;border-radius:50%;
    background:var(--fill);border:8px solid var(--line);
  }
  .b1::after,.b3::after{
    content:"";position:absolute;left:64px;bottom:-116px;
    width:26px;height:26px;border-radius:50%;
    background:var(--fill);border:7px solid var(--line);
  }

  .b2{
    --fill:#fff0e6;--line:#e07a4f;
    right:62px;top:700px;max-width:680px;
    background:var(--fill);color:#3d1608;
    border:9px solid var(--line);
    box-shadow:0 28px 70px rgba(0,0,0,.6),0 0 70px rgba(224,122,79,.32);
  }
  .b2::before{
    content:"";position:absolute;right:88px;bottom:-72px;
    width:42px;height:42px;border-radius:50%;
    background:var(--fill);border:8px solid var(--line);
  }
  .b2::after{
    content:"";position:absolute;right:64px;bottom:-116px;
    width:26px;height:26px;border-radius:50%;
    background:var(--fill);border:7px solid var(--line);
  }

  /* ---------- Overlays ---------- */
  #vignette{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 42%,rgba(0,0,0,.62) 100%);
  }
  #fade{
    position:absolute;inset:0;background:#05030c;pointer-events:none;
    animation:fadeOut 1.2s ease .15s forwards;
  }
  @keyframes fadeOut{to{opacity:0}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div class="bubble b1" id="b1">¿Por qué Claude susurra?</div>
  <div class="bubble b2" id="b2">Porque estoy pensando…</div>
  <div class="bubble b3" id="b3">Ah, ya entendí</div>

  <div id="vignette"></div>
  <div id="fade"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  'use strict';

  /* ============================================================
     1. AJUSTE DE ESCALA (1080x1920 -> pantalla del móvil)
     ============================================================ */
  var stage = document.getElementById('stage');
  function fitStage(){
    var s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', function(){ setTimeout(fitStage, 120); });
  fitStage();

  /* ============================================================
     2. RENDERER / ESCENA / CÁMARA
     ============================================================ */
  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(1080, 1920, false);
  if (renderer.outputEncoding !== undefined && THREE.sRGBEncoding !== undefined){
    renderer.outputEncoding = THREE.sRGBEncoding;
  }

  var scene = new THREE.Scene();
  scene.background = makeGradientTexture();
  scene.fog = new THREE.FogExp2(0x150b30, 0.0125);

  var camera = new THREE.PerspectiveCamera(45, 1080 / 1920, 0.1, 400);
  camera.position.set(0, 2, 25);
  camera.lookAt(0, -0.8, 0);

  /* Fondo degradado azul -> morado */
  function makeGradientTexture(){
    var cv = document.createElement('canvas');
    cv.width = 8; cv.height = 1024;
    var ctx = cv.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, 0, 1024);
    g.addColorStop(0.00, '#04081e');
    g.addColorStop(0.28, '#0a0b32');
    g.addColorStop(0.58, '#180a3c');
    g.addColorStop(0.84, '#290b46');
    g.addColorStop(1.00, '#10041d');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 8, 1024);
    var tex = new THREE.CanvasTexture(cv);
    if (THREE.sRGBEncoding !== undefined) tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  /* ============================================================
     3. LUCES
     ============================================================ */
  scene.add(new THREE.HemisphereLight(0x9a8bff, 0x1a0b33, 0.95));

  var key = new THREE.DirectionalLight(0xffe9d0, 1.15);
  key.position.set(8, 16, 14);
  scene.add(key);

  var fill = new THREE.DirectionalLight(0x7b5cff, 0.6);
  fill.position.set(-12, 4, 8);
  scene.add(fill);

  var purpleGlow = new THREE.PointLight(0x8a5cff, 2.2, 70);
  purpleGlow.position.set(-11, 4, 6);
  scene.add(purpleGlow);

  var orangeGlow = new THREE.PointLight(0xff9a6a, 1.8, 40);
  orangeGlow.position.set(4, 0, 4);
  scene.add(orangeGlow);

  /* ============================================================
     4. HELPERS
     ============================================================ */
  function mat(color, opts){
    var p = { color: color, roughness: 0.85, metalness: 0.0 };
    if (opts) for (var k in opts) p[k] = opts[k];
    return new THREE.MeshStandardMaterial(p);
  }
  function box(w, h, d, color, opts){
    var m = (color && color.isMaterial) ? color : mat(color, opts);
    return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  }

  /* ============================================================
     5. TECLADO GIGANTE DE FONDO
     ============================================================ */
  var glowMats = [];
  (function buildKeyboard(){
    var group = new THREE.Group();

    var baseGeo = new THREE.BoxGeometry(2.5, 0.9, 2.5);
    var topGeo  = new THREE.BoxGeometry(2.02, 0.28, 2.02);

    var baseMats = [
      mat(0x1d1448, { roughness: 0.6, metalness: 0.18, emissive: 0x0a0420, emissiveIntensity: 1 }),
      mat(0x221955, { roughness: 0.6, metalness: 0.18, emissive: 0x0a0420, emissiveIntensity: 1 }),
      mat(0x1a1140, { roughness: 0.6, metalness: 0.18, emissive: 0x090318, emissiveIntensity: 1 }),
      mat(0x261c5c, { roughness: 0.6, metalness: 0.18, emissive: 0x0c0526, emissiveIntensity: 1 })
    ];
    var topMat = mat(0x3a2b7a, { roughness: 0.45, metalness: 0.22, emissive: 0x241a5e, emissiveIntensity: 0.85 });

    var cols = 11, rows = 8, step = 3.0;

    for (var i = 0; i < cols; i++){
      for (var j = 0; j < rows; j++){
        var x = (i - (cols - 1) / 2) * step;
        var z = -j * step;

        var b = new THREE.Mesh(baseGeo, baseMats[(i * 7 + j * 3) % baseMats.length]);
        b.position.set(x, 0, z);
        group.add(b);

        var tm = topMat;
        if (Math.random() < 0.075){
          tm = new THREE.MeshStandardMaterial({
            color: 0x7b5cff, emissive: 0x8a6bff, emissiveIntensity: 1.5,
            roughness: 0.35, metalness: 0.1
          });
          glowMats.push(tm);
        }
        var tp = new THREE.Mesh(topGeo, tm);
        tp.position.set(x, 0.59, z);
        group.add(tp);
      }
    }

    group.rotation.x = 0.55;
    group.position.set(0, -10.5, -6);
    scene.add(group);
  })();

  /* ============================================================
     6. CHICO VOXEL CON GORRA ROJA
     ============================================================ */
  var SKIN  = 0xf2c79b;
  var CAPC  = 0xe23b3b;
  var SHIRT = 0x2fb8a8;
  var PANTS = 0x2b3358;
  var SHOE  = 0x14161f;
  var DARK  = 0x241a33;

  function createBoy(){
    var g = new THREE.Group();

    /* piernas + zapatos */
    [-0.46, 0.46].forEach(function(x){
      var leg = box(0.76, 1.55, 0.82, PANTS);
      leg.position.set(x, -2.5, 0);
      g.add(leg);

      var shoe = box(0.84, 0.4, 1.06, SHOE);
      shoe.position.set(x, -3.4, 0.12);
      g.add(shoe);
    });

    /* torso */
    var body = box(1.95, 1.75, 1.1, SHIRT);
    body.position.set(0, -0.9, 0);
    g.add(body);

    /* detalle del cuello */
    var collar = box(0.7, 0.16, 1.14, 0xffffff, { roughness: 0.9 });
    collar.position.set(0, -0.05, 0);
    g.add(collar);

    /* ---- cabeza (pivote en el cuello) ---- */
    var head = new THREE.Group();
    head.position.set(0, 0.05, 0);

    var headCube = box(1.6, 1.6, 1.6, SKIN);
    headCube.position.set(0, 0.8, 0);
    head.add(headCube);

    /* ojos */
    [-0.34, 0.34].forEach(function(x){
      var eye = box(0.24, 0.3, 0.08, DARK, { roughness: 0.4 });
      eye.position.set(x, 0.92, 0.81);
      head.add(eye);
    });

    /* boca */
    var mouth = box(0.42, 0.12, 0.08, 0x8d4a3a, { roughness: 0.6 });
    mouth.position.set(0, 0.42, 0.81);
    head.add(mouth);

    /* gorra roja */
    var capTop = box(1.74, 0.44, 1.74, CAPC, { roughness: 0.75 });
    capTop.position.set(0, 1.62, 0);
    head.add(capTop);

    var brim = box(1.74, 0.16, 0.92, CAPC, { roughness: 0.75 });
    brim.position.set(0, 1.47, 0.96);
    head.add(brim);

    var button = box(0.22, 0.16, 0.22, 0xd42a2a);
    button.position.set(0, 1.88, 0);
    head.add(button);

    g.add(head);

    /* ---- brazos (pivote en el hombro) ---- */
    function makeArm(side){
      var arm = new THREE.Group();
      arm.position.set(side * 1.27, -0.3, 0);

      var sleeve = box(0.52, 1.5, 0.58, SHIRT);
      sleeve.position.set(0, -0.75, 0);
      arm.add(sleeve);

      var hand = box(0.58, 0.42, 0.62, SKIN);
      hand.position.set(0, -1.56, 0);
      arm.add(hand);

      g.add(arm);
      return arm;
    }
    var armL = makeArm(-1);
    var armR = makeArm(1);

    return { group: g, head: head, armL: armL, armR: armR };
  }

  /* ============================================================
     7. CLAUDE: CUBO NARANJA
     ============================================================ */
  function createClaude(){
    var g = new THREE.Group();

    var bodyMat = new THREE.MeshStandardMaterial({
      color: 0xd97757, roughness: 0.62, metalness: 0.06,
      emissive: 0x521c08, emissiveIntensity: 0.55
    });
    var body = new THREE.Mesh(new THREE.BoxGeometry(2.9, 2.9, 2.9), bodyMat);
    g.add(body);

    /* ojos (grupo con pivote a la altura de los ojos -> parpadeo limpio) */
    var eyeGroup = new THREE.Group();
    eyeGroup.position.set(0, 0.48, 0);

    var eyeWhiteMat = new THREE.MeshStandardMaterial({
      color: 0xfff6ee, roughness: 0.35, emissive: 0xffffff, emissiveIntensity: 0.3
    });
    var pupilMat = new THREE.MeshStandardMaterial({ color: 0x241018, roughness: 0.5 });

    var pupils = [];
    [-0.62, 0.62].forEach(function(x){
      var w = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.62, 0.12), eyeWhiteMat);
      w.position.set(x, 0, 1.46);
      eyeGroup.add(w);

      var p = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.34, 0.1), pupilMat);
      p.position.set(x - 0.06, 0, 1.52);
      eyeGroup.add(p);
      pupils.push({ mesh: p, baseX: x - 0.06 });
    });
    g.add(eyeGroup);

    /* boca */
    var mouth = new THREE.Mesh(
      new THREE.BoxGeometry(0.78, 0.16, 0.12),
      new THREE.MeshStandardMaterial({ color: 0x8a3a1e, roughness: 0.6 })
    );
    mouth.position.set(0, -0.56, 1.46);
    g.add(mouth);

    /* brillo naranja */
    var light = new THREE.PointLight(0xff9a6a, 1.1, 22);
    light.position.set(0, 0, 2.2);
    g.add(light);

    return { group: g, eyes: eyeGroup, pupils: pupils, body: body };
  }

  /* ============================================================
     8. PARTÍCULAS
     ============================================================ */
  var particles = [];
  (function buildParticles(){
    var mats = [
      new THREE.MeshStandardMaterial({ color: 0xa48bff, emissive: 0x7b5cff, emissiveIntensity: 1.4, roughness: 0.6 }),
      new THREE.MeshStandardMaterial({ color: 0x8ecbff, emissive: 0x4f9dff, emissiveIntensity: 1.2, roughness: 0.6 }),
      new THREE.MeshStandardMaterial({ color: 0xffb38a, emissive: 0xff7a45, emissiveIntensity: 1.1, roughness: 0.6 })
    ];
    for (var i = 0; i < 70; i++){
      var s = 0.08 + Math.random() * 0.18;
      var m = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), mats[i % 3]);
      m.position.set(
        (Math.random() - 0.5) * 24,
        (Math.random() - 0.5) * 16,
        -14 + Math.random() * 22
      );
      m.userData = {
        baseY: m.position.y,
        sp: 0.2 + Math.random() * 0.5,
        ph: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 1.4
      };
      scene.add(m);
      particles.push(m);
    }
  })();

  /* ============================================================
     9. INSTANCIAS DE PERSONAJES
     ============================================================ */
  var boy = createBoy();
  boy.group.position.set(-2.45, -0.6, 0);
  scene.add(boy.group);

  var claude = createClaude();
  claude.group.position.set(2.55, -1.5, 0.4);
  scene.add(claude.group);

  /* ============================================================
     10. ESTADO DE ANIMACIÓN
     ============================================================ */
  var bs = { armLz: -0.08, armRz: 0.08, armLx: 0, armRx: 0, headX: 0, headY: 0, headZ: 0 };
  var cs = { rotY: 0, rotX: 0, rotZ: 0, posY: -1.5, sq: 1, pupil: -0.06 };

  function damp(cur, target, lambda, dt){
    return cur + (target - cur) * (1 - Math.exp(-lambda * dt));
  }

  /* ---------- CHICO ---------- */
  function updateBoy(t, dt){
    var tArmLz = -0.10, tArmRz = 0.10;
    var tArmLx = 0, tArmRx = 0;
    var tHeadX = 0, tHeadY = 0, tHeadZ = 0;
    var bob = Math.sin(t * 2.3) * 0.09;
    var hop = 0;
    var lean = 0;

    if (t >= 2.2 && t < 9.4){
      /* hablando y señalando a Claude */
      tArmRz = 1.30 + Math.sin(t * 7.0) * 0.13;
      tArmRx = -0.45;
      tArmLz = -0.18 + Math.sin(t * 7.0 + 2.0) * 0.10;
      tHeadY = 0.34 + Math.sin(t * 3.2) * 0.06;
      tHeadZ = -0.10;
      bob = Math.sin(t * 6.0) * 0.10;
      lean = 0.07;
    } else if (t >= 9.4 && t < 17.4){
      /* escuchando */
      tHeadY = 0.30 + Math.sin(t * 1.6) * 0.05;
      tHeadZ = -0.12;
      tHeadX = 0.06;
      bob = Math.sin(t * 1.8) * 0.07;
    } else if (t >= 17.4 && t < 25.2){
      /* ¡entendió! asiente y salta */
      tHeadX = Math.sin(t * 9.0) * 0.28;
      tHeadY = 0.10;
      tArmLz = -0.55; tArmRz = 0.55;
      tArmLx = -0.28; tArmRx = -0.28;
      hop = Math.abs(Math.sin(t * 4.0)) * 0.24;
    } else if (t >= 25.2){
      /* despedida saludando */
      tArmRz = 2.45 + Math.sin(t * 8.0) * 0.35;
      tArmLz = -0.20;
      tHeadY = Math.sin(t * 1.2) * 0.12;
      bob = Math.sin(t * 2.6) * 0.10;
    }

    var k = 1 - Math.exp(-9 * dt);
    bs.armLz += (tArmLz - bs.armLz) * k;
    bs.armRz += (tArmRz - bs.armRz) * k;
    bs.armLx += (tArmLx - bs.armLx) * k;
    bs.armRx += (tArmRx - bs.armRx) * k;
    bs.headX += (tHeadX - bs.headX) * k;
    bs.headY += (tHeadY - bs.headY) * k;
    bs.headZ += (tHeadZ - bs.headZ) * k;

    boy.armL.rotation.z = bs.armLz;
    boy.armL.rotation.x = bs.armLx;
    boy.armR.rotation.z = bs.armRz;
    boy.armR.rotation.x = bs.armRx;

    boy.head.rotation.x = bs.headX;
    boy.head.rotation.y = bs.headY;
    boy.head.rotation.z = bs.headZ;

    boy.group.position.y = -0.6 + bob + hop;
    boy.group.rotation.y = lean;
  }

  /* ---------- CLAUDE ---------- */
  function updateClaude(t, dt){
    var tRotY = Math.sin(t * 1.1) * 0.22;
    var tRotX = Math.sin(t * 1.4) * 0.10;
    var tRotZ = Math.sin(t * 0.9) * 0.08;
    var tPosY = -1.5 + Math.sin(t * 1.9) * 0.22;
    var tSq = 1;
    var tPupil = -0.08;

    if (t >= 2.2 && t < 9.4){
      /* escuchando al chico */
      tRotY = 0.32 + Math.sin(t * 1.6) * 0.12;
      tRotZ = Math.sin(t * 1.2) * 0.10;
      tPupil = -0.13;
    } else if (t >= 9.4 && t < 17.4){
      /* habla (susurra): rebote suave y squash */
      tRotY = Math.sin(t * 4.2) * 0.30;
      tRotZ = Math.sin(t * 3.4) * 0.12;
      tRotX = Math.sin(t * 3.0) * 0.14;
      tPosY = -1.4 + Math.abs(Math.sin(t * 3.0)) * 0.30;
      tSq = 1 + Math.sin(t * 6.0) * 0.05;
      tPupil = -0.04;
    } else if (t >= 17.4 && t < 25.2){
      /* contento: brinca */
      tRotY = Math.sin(t * 5.0) * 0.45;
      tRotZ = Math.sin(t * 5.0 + 1) * 0.16;
      tPosY = -1.3 + Math.abs(Math.sin(t * 3.4)) * 0.42;
      tSq = 1 + Math.sin(t * 6.8) * 0.07;
      tPupil = -0.10;
    } else if (t >= 25.2){
      tPosY = -1.45 + Math.sin(t * 2.0) * 0.20;
      tRotY = Math.sin(t * 1.3) * 0.3;
    }

    var k = 1 - Math.exp(-8 * dt);
    cs.rotY += (tRotY - cs.rotY) * k;
    cs.rotX += (tRotX - cs.rotX) * k;
    cs.rotZ += (tRotZ - cs.rotZ) * k;
    cs.posY += (tPosY - cs.posY) * k;
    cs.sq   += (tSq - cs.sq) * k;
    cs.pupil += (tPupil - cs.pupil) * k;

    claude.group.rotation.set(cs.rotX, cs.rotY, cs.rotZ);
    claude.group.position.y = cs.posY;
    claude.group.scale.set(1 / Math.sqrt(cs.sq), cs.sq, 1 / Math.sqrt(cs.sq));

    /* parpadeo */
    var b = t % 3.6;
    var blink = (b < 0.12) ? 0.12 : 1;
    claude.eyes.scale.y = blink;

    /* pupilas mirando al chico */
    for (var i = 0; i < claude.pupils.length; i++){
      claude.pupils[i].mesh.position.x = claude.pupils[i].baseX + cs.pupil;
    }

    /* luz naranja que respira */
    orangeGlow.intensity = 1.4 + Math.sin(t * 3.0) * 0.5;
    orangeGlow.position.x = claude.group.position.x;
    orangeGlow.position.y = claude.group.position.y;
  }

  /* ---------- CÁMARA ---------- */
  function updateCamera(t){
    camera.position.x = Math.sin(t * 0.18) * 0.8;
    camera.position.y = 2 + Math.sin(t * 0.23) * 0.35;
    camera.lookAt(0, -0.8, 0);
  }

  /* ---------- PARTÍCULAS + TECLAS ---------- */
  function updateParticles(t){
    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      var u = p.userData;
      p.position.y = u.baseY + Math.sin(t * u.sp + u.ph) * 1.2;
      p.rotation.x += 0.010 * u.spin;
      p.rotation.y += 0.013 * u.spin;
    }
    for (var j = 0; j < glowMats.length; j++){
      glowMats[j].emissiveIntensity = 0.9 + Math.sin(t * 2.0 + j * 1.7) * 0.8;
    }
  }

  /* ---------- BOCADILLOS ---------- */
  var b1 = document.getElementById('b1');
  var b2 = document.getElementById('b2');
  var b3 = document.getElementById('b3');

  function updateBubbles(t){
    b1.classList.toggle('show', t >= 2.3 && t < 9.4);
    b2.classList.toggle('show', t >= 9.9 && t < 17.3);
    b3.classList.toggle('show', t >= 17.8 && t < 25.0);
  }

  /* ============================================================
     11. BUCLE PRINCIPAL
     ============================================================ */
  var DURATION = 30;
  var clock = new THREE.Clock();
  var lastElapsed = 0;

  function animate(){
    requestAnimationFrame(animate);

    var elapsed = clock.getElapsedTime();
    var dt = elapsed - lastElapsed;
    lastElapsed = elapsed;
    if (dt > 0.1) dt = 0.1;
    if (dt < 0) dt = 0;

    var t = elapsed % DURATION;

    updateBoy(t, dt);
    updateClaude(t, dt);
    updateCamera(t);
    updateParticles(t);
    updateBubbles(t);

    renderer.render(scene, camera);
  }

  animate();

})();
</script>
